<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Student Learning Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside id="sidebar"></aside>
    <main id="content">
      <h1 class="page-title">My Profile</h1>

      <section class="card profile-hero">
        <div class="avatar big" id="p-avatar"></div>
        <div>
          <h2 id="p-name"></h2>
          <p class="muted" id="p-meta"></p>
          <p id="p-bio"></p>
        </div>
      </section>

      <section class="card">
        <h2>Edit details</h2>
        <form id="profile-form">
          <label>Full name
            <input type="text" id="f-name" maxlength="60">
          </label>
          <label>Email
            <input type="email" id="f-email" maxlength="100">
          </label>
          <label>About me
            <textarea id="f-bio" rows="4" maxlength="300"></textarea>
          </label>
          <button class="btn btn-primary" type="submit">Save changes</button>
          <span class="msg" id="p-msg"></span>
        </form>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="profile.js"></script>
</body>
</html>
