<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Student Learning Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-public>
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Student Learning Management System</h1>
      <hr class = "divider">
      <h2 class="muted">Create Account</h2>
      <form id="signup-form">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirm" placeholder="Confirm password" required>
        <button class="btn btn-primary block" type="submit">Sign up</button>
      </form>
      <p id="message" class="msg"></p>
      <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="signup.js"></script>
</body>
</html>
