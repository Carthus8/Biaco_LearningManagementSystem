<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Barebone LMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Barebone LMS</h1>
  </header>

  <main>
    <h2>Create Account</h2>
    <form id="signup-form">
      <p><input type="text" id="username" placeholder="Username" required></p>
      <p><input type="password" id="password" placeholder="Password" required></p>
      <p><input type="password" id="confirm" placeholder="Confirm password" required></p>
      <button type="submit">Sign up</button>
    </form>
    <p id="message"></p>
    <p>Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script src="signup.js"></script>
</body>
</html>
